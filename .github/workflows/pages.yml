name: Deploy website

# Publishes the static export of website/ to GitHub Pages (custom domain cf.dinhanhthi.com).
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "plugin/.claude-plugin/plugin.json"
      - "plugin/CHANGELOG.md"
      - "cli/package.json"
      - "cli/CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

      - id: deployment
        uses: actions/deploy-pages@v5
